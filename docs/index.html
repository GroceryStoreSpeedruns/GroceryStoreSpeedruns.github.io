<!DOCTYPE html>
<html>
  <head>
    <title>Grocery Store Speedruns</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

  <body>
  <h1 class="title-heading">THE GROCERY STORE SPEEDRUNS</h1>

    <div class="table-switcher">
    <input type="checkbox" id="table-toggle">
      <div class="switch-box">
      <span class="switch-label">B&M</span>
      <label class="switch" for="table-toggle">
        <span class="slider"></span>
      </label>
      <span class="switch-label">Iceland</span>
    </div>
    
    <div class="leaderboard">
    <table style="border-collapse: collapse"; class="B_M">
      <thead>
        <tr>
          <th class="leaderboard-heading">Placement</th>
          <th class="leaderboard-heading">Speedrun Time</th>
          <th class="leaderboard-heading">Date (DD/MM/YYYY)</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!--Row 1-->
        <tr>
          <td class="placement"; style="font-weight: bold; color: gold;">1st</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        <!--Row 2-->
        <tr>
          <td class="placement">2nd</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        <!--Row 3-->
        <tr>
          <td class="placement">3rd</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        <!--Row 4-->
        <tr>
          <td class="placement">4th</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        <!--Row 5-->
        <tr>
          <td class="placement">5th</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        
      </tbody>
    </table>

      <table style="border-collapse: collapse"; class="Iceland">
      <thead>
        <tr>
          <th class="leaderboard-heading">Placement</th>
          <th class="leaderboard-heading">Speedrun Time</th>
          <th class="leaderboard-heading">Date (DD/MM/YYYY)</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!--Row 1-->
        <tr>
          <td class="placement"; style="font-weight: bold; color: "gold";">1st</td>
          <td class="speedrun-time">3:42.53</td>
          <td class="date">30/02/26</td>
        </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
